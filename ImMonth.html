<div class="finalist-container"><img alt="" src="ImMonth/Encircled%20Fate%20Drug%20Delivery%20and%20Cell%20Death%20W_anonymous.png" title="title">
<p class="heading1-gallery" id="title"></p>

<p class="text-gallery" id="description"></p>

<span class="clear"> <br>
</span></div>
<sub-footer></sub-footer>
<script>
async function loadImageMonth() {
try {
const response = await fetch("ImageMonth.json");
if (!response.ok) {
throw new Error("HTTP error " + response.status);
}
const imMonth = await response.json();
document.getElementById("image").textContent =
"ImMonth/" + imMonth.image;
document.getElementById("title").textContent =
imMonth.title;
document.getElementById("authors").textContent =
imMonth.authors;
document.getElementById("study").textContent =
imMonth.study;
document.getElementById("description").textContent =
imMonth.description;
}
catch(err) {
document.getElementById("title").textContent = err.message;
}
}
loadImageMonth();
</script>
