      const jsonString = `[{"Sno":"1","PATENT":"US10007086B2","YEAR OF PATENT":"2018","FOCAL LENGTH (mm)":"3.79","F/NUMBER":"1.65","HALF FIELD (Degree)":"48.00","REFERENCE WAVELENGTH (um)":"0.5876"}
]`;
     function generateTableFromJSON(jsonRaw) {
    // 1. Parse the JSON data into a JavaScript array
    const data = JSON.parse(jsonRaw);
    if (data.length === 0) return;

    // 2. Create the table element
    const table = document.createElement("table");

    // 3. Extract headers dynamically from the first object's keys
    const headers = Object.keys(data[0]);
    
    // 4. Create the header row (thead)
    const thead = table.createTHead();
    const headerRow = thead.insertRow();
    headers.forEach(headerText => {
        const th = document.createElement("th");
        th.textContent = headerText; // Safe from XSS injection
        headerRow.appendChild(th);
    });

    // 5. Create the table body (tbody) and populate rows
    const tbody = table.createTBody();
    data.forEach(item => {
        const row = tbody.insertRow();
        headers.forEach(header => {
            const cell = row.insertCell();
            // Fallback to empty string if the property doesn't exist in the current object
            cell.textContent = item[header] !== undefined ? item[header] : "";
        });
    });

    // 6. Inject the completed table into the container element
    const container = document.getElementById("table-container");
    container.innerHTML = ""; // Clear any prior content
    container.appendChild(table);
}
      
      generateTableFromJSON(jsonString);
