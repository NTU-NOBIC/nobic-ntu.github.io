    <!-- The table will be injected here -->
    <div id="table-container"></div>
    
    
    <script>
        async function loadTableFromJSON() {
            try {
                // Fetch the JSON file
                const response = await fetch('Mobile.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();

                if (data.length === 0) return;
              
              	// Create the table element
    						const table = document.createElement("table");

                // Dynamically generate headers from the object keys
                const headers = Object.keys(data[0]);
                const thead = table.createTHead();
              	const tbody = document.createElement("tbody");
              
              	const headerRow = thead.insertRow();
                headers.forEach(headerText => {
                    const th = document.createElement("th");
                    th.textContent = headerText; // Safe from XSS injection
                    headerRow.appendChild(th);
                });
              
                // Create data rows
                data.forEach(item => {
                  const tr = document.createElement("tr");

                  // Store original JSON object on the row element
                  tr._rawJSON = item;

                  // Add click event listener to each row
                  tr.addEventListener("click", function() {
                    const jsonString = JSON.stringify(this._rawJSON);
                    localStorage.setItem("sharedData", jsonString);
                    console.log("Exported Row JSON:", this._rawJSON);
                    window.open("LensDetail.html", "_blank");
                  });

                  // Populate cells
                  headers.forEach(key => {
                    const td = document.createElement("td");
                    td.textContent = item[key];
                    tr.appendChild(td);
                  });

                  tbody.appendChild(tr);
                });

                table.appendChild(tbody);

                // Inject the completed table into the container element
                const container = document.getElementById("table-container");
                container.innerHTML = ""; // Clear any prior content
                container.appendChild(table);

            } catch (error) {
                console.error('Error fetching or processing JSON:', error);
            }
        }
    
       // Initialize table generation on page load
        window.addEventListener('DOMContentLoaded', loadTableFromJSON);
          
       
    </script>
  </body>
