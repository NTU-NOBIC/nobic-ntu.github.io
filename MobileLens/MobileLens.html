    <table id="json-table">
        <thead>
            <tr id="table-header"></tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>
    <script>
        async function loadTableFromJSON() {
            try {
                // 1. Fetch the JSON file
                const response = await fetch('Mobile.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();

                if (data.length === 0) return;

                // 2. Dynamically generate headers from the object keys
                const headers = Object.keys(data[0]);
                const headerRow = document.getElementById('table-header');
                headerRow.innerHTML = headers.map(header => `<th>${header.toUpperCase()}</th>`).join('');

                // 3. Generate table body rows
                const tableBody = document.getElementById('table-body');
                const rowsHTML = data.map(item => {
                    const cells = headers.map(header => `<td>${item[header] ?? ''}</td>`).join('');
                    return `<tr>${cells}</tr>`;
                }).join('');

                tableBody.innerHTML = rowsHTML;

            } catch (error) {
                console.error('Error fetching or processing JSON:', error);
            }
        }

        // Initialize table generation on page load
        window.addEventListener('DOMContentLoaded', loadTableFromJSON);
    </script>
  </body>
