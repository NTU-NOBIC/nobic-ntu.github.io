<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <!--Coded by NOBIC with a lot of help from code snippets from www.w3schools.com-->
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Mobile Lens Database</title>
    <link rel="stylesheet" href="../ImContest/Contest_styles.css">
    <link rel="shortcut icon" type="image/ico" href="../Media/Icon.png">
    <script>
document.addEventListener("click", x=>0)
</script> <script async="" src="//static.getclicky.com/101389963.js"></script>
    <script src="../Elements.js"></script>
  </head>
  <body style=" background-color: white;">
    <div class="finalist-container"><img alt="" id="DispImage">
      <p class="heading1-gallery" id="patent"></p>
      <p class="heading2-gallery" id="year"></p>
      <p class="heading2-gallery" id="foclength"></p>
      <p class="heading2-gallery" id="fnum"></p>
      <p class="heading2-gallery" id="hafield"></p>
      <p class="heading2-gallery" id="refwave"></p>
      <span class="clear"> <br>
      </span></div>
    <sub-footer></sub-footer>
    <script>
      const queryString = window.location.search;
			const urlParams = new URLSearchParams(queryString);
      
      document.getElementById("DispImage").src = "Data/"+urlParams.PATENT+"/"+urlParams.PATENT+".jpg";
document.getElementById("DispImage").title = urlParams.PATENT;
      document.getElementById("patent").textContent =
urlParams.get('PATENT');
       document.getElementById("year").textContent =
"Year of patent: "+urlParams.get('YEAR OF PATENT');
       document.getElementById("foclength").textContent =
"Focal length (mm): "+urlParams.get('FOCAL LENGTH (mm)');
       document.getElementById("fnum").textContent =
"F/number: "+urlParams.get('F/NUMBER');
       document.getElementById("hafield").textContent =
"Half field (degree): "+urlParams.get('HALF FIELD (Degree)');
       document.getElementById("refwave").textContent =
"Reference wavelength (um): "+urlParams.get('REFERENCE WAVELENTH (um)');

</script>
  </body>
</html>
