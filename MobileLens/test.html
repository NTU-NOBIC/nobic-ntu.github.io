        th { background-color: #f4f4f4; cursor: pointer; user-select: none; }
        th:hover { background-color: #e2e2e2; }

</head>

// 2. Track the sorting state
let currentSortColumn = null;
let isAscending = true;

// 3. Main function to initialize and render the structure
function initTable() {
    const container = document.getElementById("table-container");
    
    // Create table wrapper elements
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const tbody = document.createElement("tbody");
    tbody.id = "table-body"; // ID reference to easily target rows later
    
    table.appendChild(thead);
    table.appendChild(tbody);

    const headerRow = document.createElement("tr");

    headers.forEach(headerText => {
        const th = document.createElement("th");
        th.textContent = headerText.toUpperCase();
        
        // Bind click event to each header column
        th.addEventListener("click", () => handleSort(headerText));

    });

    thead.appendChild(headerRow);

    // Initial render of data rows
    renderTableRows();
}

// 4. Function dedicated strictly to drawing/updating rows
function renderTableRows() {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = ""; // Clear existing rows to prevent duplicates

    employees.forEach(item => {
        const row = document.createElement("tr");
        
        // Loop through keys to guarantee data lines up with columns
        Object.keys(item).forEach(key => {
            const td = document.createElement("td");
            td.textContent = item[key];
            row.appendChild(td);
        });
        
        tbody.appendChild(row);
    });
}

// 5. Logic handling the JSON sort mechanism
function handleSort(columnKey) {
    // If clicking the same column, toggle direction. Otherwise, default to ascending.
    if (currentSortColumn === columnKey) {
        isAscending = !isAscending;
    } else {
        currentSortColumn = columnKey;
        isAscending = true;
    }

    // Sort the primary array directly
    employees.sort((a, b) => {
        let valA = a[columnKey];
        let valB = b[columnKey];

        // Handle string comparison vs number comparison
        if (typeof valA === 'string') {
            return isAscending 
                ? valA.localeCompare(valB) 
                : valB.localeCompare(valA);
        } else {
            // Numeric fallback
            return isAscending ? valA - valB : valB - valA;
        }
    });

    // Re-render only the body rows with the newly ordered data
    renderTableRows();
}

// Execute when page loads
window.onload = initTable;
  </script>
