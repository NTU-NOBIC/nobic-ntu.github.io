<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>test.html</title>
  </head>
  <body>
   <table id="myTable">
  <thead>
    <tr><th>Name</th><th>Role</th></tr>
  </thead>
  <tbody>
    <tr data-id="101" style="cursor: pointer;">
      <td>Alice</td>
      <td>Developer</td>
    </tr>
    <tr data-id="102" style="cursor: pointer;">
      <td>Bob</td>
      <td>Designer</td>
    </tr>
  </tbody>
</table>

<script>
  const table = document.getElementById('myTable');
  
  table.addEventListener('click', (event) => {
    // Find the closest row to the clicked element (in case they clicked a <td>)
    const row = event.target.closest('tr');
    
    // Ensure the click was inside a <tbody> row, not the <thead>
    if (row && row.closest('tbody')) {
      const rowId = row.dataset.id;
      console.log(`Clicked row with ID: ${rowId}`);
      // Perform your action here (e.g., redirect or open modal)
    }
  });
</script>
  </body>
</html>
