<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sortable JSON Table</title>
    <style>
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; cursor: pointer; user-select: none; }
        th::after { content: ' ↕'; font-size: 0.8em; color: #999; }
    </style>
</head>
<body>

    <!-- Target container for the dynamically generated table -->
    <div id="table-container"></div>

    <script>
        // 1. Mock JSON Data (Simulating a fetch from a json file)


        // Track current sorting direction for each column
        let sortDirection = true; // true = ascending, false = descending
        let currentSortColumn = null;

        // 2. Function to dynamically generate the HTML table
        function renderTable(data) {
            const container = document.getElementById('table-container');
            container.innerHTML = ''; // Clear previous table if any

            if (data.length === 0) return;

            const table = document.createElement('table');
            const thead = document.createElement('thead');
            const tbody = document.createElement('tbody');

            // Extract headers from the object keys
            const keys = Object.keys(data[0]);

            // Create Header Row
            const headerRow = document.createElement('tr');
            keys.forEach(key => {
                const th = document.createElement('th');
                th.textContent = key.charAt(0).toUpperCase() + key.slice(1);
                
                // Attach click event to sort by this column
                th.addEventListener('click', () => sortTableByColumn(key));
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);

            // Create Data Rows
            data.forEach(item => {
                const row = document.createElement('tr');
                keys.forEach(key => {
                    const td = document.createElement('td');
                    td.textContent = item[key];
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            container.appendChild(table);
        }

        // 3. Function to sort data array and trigger re-render
        function sortTableByColumn(columnKey) {
            // Reverse direction if clicking the same column, otherwise default to ascending
            if (currentSortColumn === columnKey) {
                sortDirection = !sortDirection;
            } else {
                sortDirection = true;
                currentSortColumn = columnKey;
            }

            // Sort the array natively
            jsonData.sort((a, b) => {
                let valueA = a[columnKey];
                let valueB = b[columnKey];

                // Handle numbers vs strings naturally
                if (typeof valueA === 'number' && typeof valueB === 'number') {
                    return sortDirection ? valueA - valueB : valueB - valueA;
                } else {
                    valueA = String(valueA).toLowerCase();
                    valueB = String(valueB).toLowerCase();
                    
                    if (valueA < valueB) return sortDirection ? -1 : 1;
                    if (valueA > valueB) return sortDirection ? 1 : -1;
                    return 0;
                }
            });

            // Re-render the table with newly sorted data
            renderTable(jsonData);
        }

        // 4. Initial call to display the table on page load
        // If loading from an actual file, wrap this in a fetch() request

// Fetch file and render table initially
let jsonData = []; 

function loadTableData() {
    // Using a root-relative path
    fetch('/data.json') 
        .then(response => {
            // Check if the server actually returned the file successfully (Status 200)
            if (!response.ok) {
                throw new Error(`HTTP Error! Status: ${response.status} - File not found or inaccessible.`);
            }
            return response.json();
        })
        .then(data => {
            console.log("Data successfully fetched from server:", data);
            jsonData = data;       // Save it globally for sorting
            renderTable(jsonData); // Build the HTML table
        })
        .catch(error => {
            // This will log the EXACT problem to your F12 Console
            console.error("Fetch implementation failed:", error.message);
        });
}

// Execute the fetch
loadTableData();

    </script>
</body>
</html>
